version: 2

models:
  - name: kpi_planning_slippage
    description: Historical planning-change analysis comparing previous versus current project planning values.
    columns:
      - name: project_key
        tests:
          - not_null
      - name: dbt_valid_from
        tests:
          - not_null
      - name: has_planning_change
        tests:
          - not_null

  - name: kpi_planning_slippage_summary
    description: Aggregated planning slippage indicators by district and snapshot month.
    columns:
      - name: snapshot_month
        tests:
          - not_null
      - name: records_in_snapshot
        tests:
          - not_null
