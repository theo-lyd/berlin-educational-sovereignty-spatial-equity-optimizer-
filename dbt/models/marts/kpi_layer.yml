version: 2

models:
  - name: kpi_district_summary
    description: District-level demand and supply summary for planning decisions.
    columns:
      - name: bezirk_clean
        tests:
          - not_null
          - unique

  - name: kpi_school_type_mismatch
    description: School-type demand versus planned-capacity comparison.
    columns:
      - name: schulart_clean
        tests:
          - not_null
          - unique

  - name: kpi_delivery_timeline
    description: Delivery timeline showing when planned capacity becomes available.
    columns:
      - name: delivery_year
        tests:
          - not_null
          - unique

  - name: kpi_inclusion_coverage
    description: Special-needs demand and planned capacity coverage by district.
    columns:
      - name: bezirk_clean
        tests:
          - not_null
          - unique

  - name: kpi_project_risk_ranking
    description: Ranked project risk scores using timing, cost, interim dependency, missing data, and demand pressure.
    columns:
      - name: project_key
        tests:
          - not_null
      - name: project_risk_rank
        tests:
          - not_null

  - name: kpi_data_trust_score
    description: Completeness, missingness, and trust score by model plus overall.
    columns:
      - name: model_name
        tests:
          - not_null
          - unique

  - name: kpi_executive_overview
    description: Single-row executive KPI overview for stakeholder reporting.
    columns:
      - name: total_student_demand
        tests:
          - not_null
      - name: total_planned_capacity
        tests:
          - not_null
      - name: total_gap
        tests:
          - not_null

  - name: kpi_district_comparison
    description: District and school-type comparison table for demand vs supply dashboards.
    columns:
      - name: bezirk_clean
        tests:
          - not_null
      - name: schulart_clean
        tests:
          - not_null

  - name: kpi_delay_risk_dashboard
    description: Delay and risk focused project dataset for operational monitoring.
    columns:
      - name: project_key
        tests:
          - not_null
      - name: delayed_handover_flag
        tests:
          - not_null
      - name: expensive_delayed_project_flag
        tests:
          - not_null

  - name: kpi_zugigkeit_scatter
    description: Scatter-ready dataset for student volume versus planned track count.
    columns:
      - name: bezirk_clean
        tests:
          - not_null
      - name: schulart_clean
        tests:
          - not_null

  - name: kpi_data_quality_dashboard
    description: Data quality summary metrics for missing, invalid, k. A., and incomplete records.
    columns:
      - name: model_name
        tests:
          - not_null
          - unique
